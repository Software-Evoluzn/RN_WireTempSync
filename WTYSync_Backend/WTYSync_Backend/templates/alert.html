<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
</head>
<body style="font-family: Arial, sans-serif; background:#f4f4f4; padding:20px;">
  <div style="max-width:500px; margin:auto; background:#ffffff; border-radius:8px; padding:24px; border:1px solid #eee;">
    <h2 style="color:#d9534f; margin-top:0;">⚠️ Temperature Threshold Exceeded</h2>
    <p>Device <strong>{{ serial_number }}</strong> has exceeded its configured threshold.</p>
    <table style="width:100%; border-collapse:collapse; margin:16px 0;">
      <tr>
        <td style="padding:8px; border-bottom:1px solid #eee;"><strong>Threshold</strong></td>
        <td style="padding:8px; border-bottom:1px solid #eee;">{{ threshold }}</td>
      </tr>
      <tr>
        <td style="padding:8px; border-bottom:1px solid #eee;"><strong>Exceeded Phases</strong></td>
        <td style="padding:8px; border-bottom:1px solid #eee;">{{ exceeded_phases }}</td>
      </tr>
      <tr>
        <td style="padding:8px;"><strong>Time</strong></td>
        <td style="padding:8px;">{{ timestamp }}</td>
      </tr>
    </table>
    <p style="color:#777; font-size:13px;">You will not receive another alert for this device until the values return below the threshold.</p>
  </div>
</body>
</html>
